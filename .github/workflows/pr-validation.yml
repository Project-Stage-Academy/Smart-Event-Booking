name: PR Validation

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-test-api:
    name: API Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore -p:Configuration=Release

      - name: Build project
        run: dotnet build --no-restore --configuration Release

      - name: Run Unit & Integration Tests
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Verify API Dockerfile builds
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/api/SmartEventBooking.Web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max


  build-and-test-client:
    name: Client UI Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./src/client
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: src/client/.nvmrc
          cache: 'npm'
          cache-dependency-path: ./src/client/package-lock.json
        
      - name: Install dependencies
        run: npm ci

      - name: Run client tests
        run: npm test -- --watch=false

      - name: Verify Client Dockerfile builds
        uses: docker/build-push-action@v5
        with:
          context: ./src/client
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
