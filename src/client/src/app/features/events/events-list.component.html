<div class="events-container">
  <h2>Upcoming Events</h2>
  
  <div class="filters-panel">
    <input type="text" [(ngModel)]="searchFilters.keyword" placeholder="Search by title or description" (keyup.enter)="applyFilters()">
    
    <select [(ngModel)]="searchFilters.categoryId" (change)="applyFilters()">
      <option [ngValue]="undefined">All Categories</option>
      <option *ngFor="let cat of categories" [ngValue]="cat.id">{{ cat.name | titlecase }}</option>
    </select>
    
    <div class="date-filters">
      <input type="date" [(ngModel)]="searchFilters.startDate" placeholder="Start Date" (change)="applyFilters()">
      <input type="date" [(ngModel)]="searchFilters.endDate" placeholder="End Date" (change)="applyFilters()">
    </div>
    
    <div class="filter-actions">
      <button class="btn-clear" (click)="clearFilters()">Clear Filters</button>
    </div>
  </div>
  
  <div *ngIf="!isLoading; else loading">
    <div class="events-table-wrapper" *ngIf="totalCount > 0; else emptyState">
      <table class="events-table">
        <thead>
          <tr>
            <th>Title</th>
            <th>Category</th>
            <th>Date</th>
            <th>Location</th>
            <th>Price</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let event of paginatedEvents">
            <td>{{ event.title }}</td>
            <td class="category-cell">
              <ng-container *ngIf="event.categories?.length; else noCategory">
                <span
                  class="category-badge"
                  *ngFor="let cat of event.categories"
                  [style.background-color]="getCategoryBg(cat)"
                  [style.color]="getCategoryTextColor(cat)">
                  {{ cat | titlecase }}
                </span>
              </ng-container>
              <ng-template #noCategory>—</ng-template>
            </td>
            <td>
              <i class="bi bi-calendar-event"></i> {{ event.startDateTime | date: 'mediumDate' }}
            </td>
            <td>
              <span *ngIf="event.venue"><i class="bi bi-geo-alt"></i> {{ event.venue.name }}</span>
              <span *ngIf="!event.venue">-</span>
            </td>
            <td>
              <span *ngIf="event.price">{{ event.price | currency }}</span>
              <span *ngIf="!event.price">Free</span>
            </td>
            <td>
              <a [routerLink]="['/events', event.id]" class="btn-primary">View Details</a>
            </td>
          </tr>
        </tbody>
      </table>

      <div class="pagination-footer" *ngIf="totalPages > 1">
        <button [disabled]="currentPage === 1" (click)="prevPage()">Previous</button>
        <span class="pages-list">
          <button 
            *ngFor="let page of getPages()" 
            [class.active]="page === currentPage" 
            (click)="goToPage(page)">
            {{ page }}
          </button>
        </span>
        <button [disabled]="currentPage === totalPages" (click)="nextPage()">Next</button>
      </div>
    </div>

    <ng-template #emptyState>
      <p>No upcoming events found.</p>
    </ng-template>
  </div>
  
  <ng-template #loading>
    <div class="loading">Loading events...</div>
  </ng-template>
</div>
